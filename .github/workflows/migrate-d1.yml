name: Apply D1 Migrations

on:
  workflow_dispatch:

concurrency:
  group: migrate-production-d1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply production migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: List pending migrations
        run: npx wrangler d1 migrations list isolated-tech-store --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations
        run: npx wrangler d1 migrations apply isolated-tech-store --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify vox.md rename
        run: >-
          npx wrangler d1 execute isolated-tech-store --remote
          --command "SELECT slug, name, is_published FROM apps WHERE lower(slug) LIKE '%vox%' OR lower(name) LIKE '%vox%'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
